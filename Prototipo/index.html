<!DOCTYPE html> <!-- Indica es un documentos HTML moderno -->

<html lang="es">

<head> <!-- Configuracion de la página -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNILIB</title>
    <link rel="stylesheet" href="css/styles.css">  <!-- Conectar con el styles que está en css -->
</head>

<body>
    <div class="overlay">
        <div class="hero-box">

            <div class="icon">
                <i data-lucide="book-open"></i>
            </div>

            <h1>UNILIB</h1>
            <h2>Sistema de Gestión Bibliotecaria</h2>

            <p>
                Plataforma centralizada para administrar préstamos,
                catálogo de libros, usuarios y reportes.
            </p>

            <div class="modules">

                <div class="card">
                    <i data-lucide="book-open"></i>
                    <span>Libros</span>
                </div>

                <div class="card">
                    <i data-lucide="arrow-right-left"></i>
                    <span>Préstamos</span>
                </div>

                <div class="card">
                    <i data-lucide="users"></i>
                    <span>Usuarios</span>
                </div>

                <div class="card">
                    <i data-lucide="chart-column"></i>
                    <span>Reportes</span>
                </div>

            </div>

            <button id="login-button">Ingresar</button>   
            
        </div>
    </div>

    <footer class="project-footer">
        RQY1102-UNILIB • DUOC UC
    </footer>


    <script>
        lucide.createIcons();
    </script>

    <script src="js/app.js"></script>

</body>

</html>
